name: Publish Kodi repository
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching addon.xml (for example v0.2.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: kodi-repository-publication
  cancel-in-progress: false
jobs:
  publish:
    # Kodi users need public, unauthenticated access to the update feed.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -r requirements-security.txt
      - run: python -W error -m coverage run -m unittest discover -s tests -v
      - run: python -m coverage report
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_workflows.py --download
      - run: python scripts/check_secrets.py --download
      - run: python scripts/validate_release.py
      - name: Publish update feed and prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python scripts/publish_repository.py --tag "$RELEASE_TAG" --github-repository "$RELEASE_REPOSITORY"
