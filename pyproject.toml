[tool.ruff]
target-version = "py38"
line-length = 110
exclude = ["ebibliovenv", "tmp", "dist", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W605"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"] # Kodi doubles must exist before importing the real application.

[tool.coverage.run]
branch = true
source = ["resources/lib", "addon"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover"]
